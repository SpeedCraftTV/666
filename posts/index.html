<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Archives - Mon Blogu</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../script.js" defer></script>
</head>
<body>
  <center>
    <marquee class="banner">ARCHIVES - Tous les vieux posts</marquee>
  <h1 class="site-title">Arhives du blog</h1>

    <p class="meta">Voila la liste de toux les posts disponible. Clique pour lires l'artcle complet (faites gaffe aux faute d'ortografe).</p>

    <!-- Search UI -->
    <div id="search-area" style="width:80%; margin:8px auto 0; text-align:left;">
      <label for="search-input">Recherche texte:</label>
      <input id="search-input" type="text" placeholder="Tape un mot clef, ex: 486 ou retro" style="width:60%; padding:6px; margin-left:8px">
      <button id="clear-filters" style="margin-left:8px; padding:6px">Tout effacer</button>

      <div style="margin-top:10px;">Filtrer par tags:</div>
      <div id="tag-filters" style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;"></div>
    </div>

    <div id="posts-list" style="width:80%; margin:12px auto; text-align:left;">
      <!-- generated list -->
    </div>

    <hr style="width:80%">
    <p><a href="../index.html">← Retour à l'accueil</a></p>
    <script src="./search.js" defer></script>
  </center>
</body>
</html>
