<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title>contact - mon blogu</title>
		<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
		<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23b30000'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='%23ffffff' font-family='monospace'>:)</text></svg>" />
		<link rel="stylesheet" href="styles.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<center>
			<h1 class="site-title">contacte moi (ou envois un castor)</h1>

			<form id="contact-form">
				<table class="contact-table">
					<tr>
						<td>nom:</td>
						<td><input type="text" name="nom" required /></td>
					</tr>
					<tr>
						<td>email:</td>
						<td><input type="email" name="email" required /></td>
					</tr>
					<tr>
						<td>message:</td>
						<td><textarea name="message" rows="6" cols="40" required></textarea></td>
					</tr>
					<tr>
						<td></td>
						<td><input type="submit" value="envoyé!!" /></td>
					</tr>
				</table>
			</form>

			<p>ou envois un mail a: <a href="mailto:admin@example.com">minicastorbot@gmail.com</a></p>

			<p>
				<a href="index.html">retour a l'accueuil</a></p>	
		</center>
	</body>
</html>
