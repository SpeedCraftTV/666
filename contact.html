<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Contact - Mon Blogu</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <center>
  <h1 class="site-title">Contactez-moi (ou envoyez un pigeon)</h1>

    <form id="contact-form">
      <table class="contact-table">
        <tr><td>Nom:</td><td><input type="text" name="nom" required></td></tr>
        <tr><td>Email:</td><td><input type="email" name="email" required></td></tr>
        <tr><td>Message:</td><td><textarea name="message" rows="6" cols="40" required></textarea></td></tr>
        <tr><td></td><td><input type="submit" value="Envoyé!"></td></tr>
      </table>
    </form>

    <p>Ou envoie un email à: <a href="mailto:admin@example.com">admin@example.com</a></p>

    <p><a href="index.html">Retour à l'accueil</a></p>
  </center>
</body>
</html>
